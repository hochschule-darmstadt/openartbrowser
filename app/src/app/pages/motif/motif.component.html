@if (idDoesNotExist) {
  <div class="container entity motif">
    <div class="row pb-4 pb-sm-5 mb-sm-5">
      <app-error-message [id]="motifId"></app-error-message>
    </div>
  </div>
}

@if (!idDoesNotExist) {
  <div class="container entity motif">
    <div class="row mb-4 pb-4 border-bottom">
      @if (motif) {
        <div class="col-sm-7">
          <app-title [entity]="motif"></app-title>
          <app-sticky-title [entity]="motif"></app-sticky-title>
          <div class="mb-3 mt-3">
            @if (motif?.description) {
              <p class="mb-1 first-letter">
                {{ motif?.description }}
              </p>
            }
          </div>
          @if (motif.abstract) {
            <div class="mt-2">
              <app-collapse>
                <app-abstract [entity]="motif"></app-abstract>
              </app-collapse>
            </div>
          }
        </div>
      }
      @if (motif?.image) {
        <div class="col-sm-5 img">
          <img class="img-fluid rounded-circle" src="{{ motif?.imageSmall }}" alt="" />
        </div>
      }
    </div>
    <span class="artworks-amount">{{ motif?.absoluteRank }}</span>
    <span class="ms-1 slider-heading" i18n="Artworks label@@artworks">Artworks</span>
    <app-fetching-list id="artworks-list" [query]="query" [options]="fetchOptions"></app-fetching-list>
  </div>
}
