@if (value || values?.length || isHref) {
  <div class="row">
    <div class="col-md-2">
      <p class="mb-1 text-muted">{{ label }}:</p>
    </div>
    <div class="col-md-10">
      @if (value) {
        <p class="mb-1 add-padding notchip">
          @if (!isHref) {
            <span>{{ value }}</span>
          }
          @if (isHref) {
            <a href="{{ value }}" target="_blank">{{ value }}</a>
          }
        </p>
      }
      @if (values?.length) {
        <p class="mb-1 add-padding">
          @for (entity of values; track entity) {
            <app-badge [entity]="entity"></app-badge>
          }
        </p>
      }
    </div>
  </div>
}
