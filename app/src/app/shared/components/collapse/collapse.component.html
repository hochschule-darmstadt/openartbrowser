<div class="col-md row more" (click)="toggle()">
  @if (showVideo) {
    <div class="me-2 mt-auto mb-auto text-muted">
      <i class="fab fa-youtube fa-2x"></i>
    </div>
  }

  <h4 class="mt-auto mb-auto debug">
    <ng-container i18n="Detail More label@@more">More</ng-container>
    @if (collapse) {
      <i class="fas fa-chevron-down"> </i>
    }
    @if (!collapse) {
      <i class="fas fa-chevron-up"> </i>
    }
  </h4>
</div>

<div
  [ngClass]="{
    'collapse-element': collapse,
    'collapse-element-show': !collapse
  }"
  >
  <ng-content></ng-content>
</div>
