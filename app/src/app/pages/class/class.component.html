@if (idDoesNotExist) {
  <div class="container entity class">
    <div class="row pb-4 pb-sm-5 border-bottom mobile-no-border">
      <app-error-message [id]="classId"></app-error-message>
    </div>
  </div>
}

@if (!idDoesNotExist) {
  <div class="container entity class">
    <div class="row pb-4 pb-sm-5 border-bottom">
      @if (class) {
        <div class="col-sm-7">
          <app-title [entity]="class"></app-title>
          <app-sticky-title [entity]="class"></app-sticky-title>
          <div class="mb-3 mt-3 mt-sm-5">
            @if (class?.description) {
              <p class="mb-1 first-letter">
                {{ class?.description }}
              </p>
            }
          </div>
          @if (parentClasses) {
            <app-information
              i18n-label="Parent Class label@@parent_class"
              label="Parent Class"
              [values]="parentClasses"
              [isEntityPage]="true"
            ></app-information>
          }
          @if (class.abstract) {
            <div>
              <app-collapse>
                <app-abstract [entity]="class"></app-abstract>
              </app-collapse>
            </div>
          }
        </div>
      }
      @if (class?.image) {
        <div class="col-sm-5 img">
          <img class="img-fluid rounded-circle" src="{{ class?.imageSmall }}" alt="" />
        </div>
      }
    </div>
    <span class="artworks-amount">{{ class?.absoluteRank }}</span>
    <span class="ms-1 slider-heading" i18n="Artworks label@@artworks">Artworks</span>
    <app-fetching-list id="artworks-list" [query]="query" [options]="fetchOptions"></app-fetching-list>
  </div>
}
